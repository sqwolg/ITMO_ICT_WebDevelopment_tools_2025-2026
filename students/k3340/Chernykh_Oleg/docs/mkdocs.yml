site_name: Олег Черных — Web-программирование
site_author: Олег Черных, K3340
site_url: https://sqwolg.github.io/ITMO_ICT_WebDevelopment_tools_2025-2026/
repo_url: https://github.com/sqwolg/ITMO_ICT_WebDevelopment_tools_2025-2026
repo_name: ITMO_ICT_WebDevelopment_tools_2025-2026

nav:
  - Главная: index.md
  - Лабораторная 1 — FastAPI:
      - Обзор: lr1/index.md
      - API: lr1/api.md
      - Модели и база данных: lr1/database.md
      - Запуск: lr1/run.md
  - Лабораторная 2 — Потоки и асинхронность:
      - Обзор: lr2/index.md
      - Задание 1: lr2/task1.md
      - Задание 2: lr2/task2.md
  - Лабораторная 3 — Docker и Celery:
      - Обзор: lr3/index.md
      - Архитектура: lr3/architecture.md
      - Docker Compose: lr3/docker-compose.md
      - API и очередь: lr3/api-and-celery.md

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
